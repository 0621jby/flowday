user nginx;
worker_processes 1;
pid /run/flowday-nginx.pid;
error_log stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    log_format safe '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout safe;

    server {
        listen 443 ssl;
        server_name 101.201.196.177;
        ssl_certificate /etc/letsencrypt/live/flowday-ip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/flowday-ip/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 6m;

        location / {
            proxy_pass http://127.0.0.1:13100;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache off;
            proxy_buffering off;
        }
    }
}
